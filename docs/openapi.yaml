openapi: 3.0.3
info:
  title: Agregator IT vakansiy API
  version: 0.2.0
  description: |
    Платформа-агрегатор ИТ-вакансий с обратной механикой подбора.
    Авторизация: Bearer JWT (получается через /api/auth/login).

    Демо-аккаунты после `npm run seed`:
      candidate@demo.local / demo1234
      employer@demo.local  / demo1234
      admin@local         / admin1234

servers:
  - url: http://localhost:3000
    description: Local dev server

tags:
  - name: auth
  - name: meta
  - name: candidates
  - name: vacancies
  - name: offers
  - name: applications
  - name: tasks
  - name: testing
  - name: fsp
  - name: me
  - name: admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string, enum: [candidate, employer] }
        email_verified: { type: boolean }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Candidate:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true }
        fsp_id: { type: string, nullable: true }
        full_name: { type: string }
        email: { type: string, nullable: true }
        telegram: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        stack: { type: string }
        grade: { type: string, enum: [junior, middle, senior, lead] }
        role: { type: string }
        experience_years: { type: integer }
        work_format: { type: string, enum: [office, hybrid, remote] }
        city: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        soft_skills: { type: string, nullable: true }
        verified_grade: { type: string, nullable: true }
        privacy_publish: { type: boolean }
        privacy_show_contacts: { type: boolean }
        privacy_show_achievements: { type: boolean }
        privacy_show_in_search: { type: boolean }
    Achievement:
      type: object
      properties:
        discipline: { type: string }
        competition: { type: string }
        result: { type: string, nullable: true }
        role: { type: string, nullable: true }
        rank: { type: string, nullable: true }
        year: { type: integer, nullable: true }
    Vacancy:
      type: object
      properties:
        id: { type: integer }
        employer_id: { type: integer, nullable: true }
        title: { type: string }
        company: { type: string }
        description: { type: string }
        stack: { type: string }
        grade: { type: string, enum: [junior, middle, senior, lead] }
        role: { type: string }
        salary_from: { type: integer, nullable: true }
        salary_to: { type: integer, nullable: true }
        work_format: { type: string, enum: [office, hybrid, remote] }
        city: { type: string, nullable: true }
        is_active: { type: boolean }
        moderation_status: { type: string, enum: [ok, review, hidden] }
    Offer:
      type: object
      properties:
        id: { type: integer }
        vacancy_id: { type: integer }
        candidate_id: { type: integer }
        employer_id: { type: integer, nullable: true }
        salary_from: { type: integer, nullable: true }
        salary_to: { type: integer, nullable: true }
        message: { type: string, nullable: true }
        status: { type: string, enum: [sent, viewed, accepted, declined] }
        created_at: { type: string, format: date-time }
        vacancy_title: { type: string }
        company: { type: string }
        candidate_name: { type: string }
    Application:
      type: object
      properties:
        id: { type: integer }
        vacancy_id: { type: integer }
        candidate_id: { type: integer }
        cover_letter: { type: string, nullable: true }
        status: { type: string, enum: [sent, viewed, accepted, declined] }
        created_at: { type: string, format: date-time }
    Task:
      type: object
      properties:
        id: { type: integer }
        employer_id: { type: integer }
        vacancy_id: { type: integer, nullable: true }
        candidate_id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [assigned, submitted, reviewed_ok, reviewed_bad] }
        solution: { type: string, nullable: true }
        score: { type: integer, nullable: true }
        reviewer_comment: { type: string, nullable: true }

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      security: []
      summary: Healthcheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  time: { type: string, format: date-time }

  /api/meta:
    get:
      tags: [meta]
      security: []
      summary: Справочники грейдов, ФСП, лимитов модерации
      responses:
        '200': { description: OK }

  /api/testing/meta:
    get:
      tags: [testing]
      security: []
      summary: Специализации, грейды, cooldown тестов
      responses:
        '200': { description: OK }

  /api/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Регистрация по email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                role: { type: string, enum: [candidate, employer] }
                displayName: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  email: { type: string }
                  role: { type: string }
                  email_verified: { type: boolean }
                  dev_verification_code: { type: string }
        '409':
          description: Email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/verify-email:
    post:
      tags: [auth]
      security: []
      summary: Подтверждение email по коду
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200':
          description: OK
        '400':
          description: Invalid / expired code

  /api/auth/resend-code:
    post:
      tags: [auth]
      security: []
      summary: Перевыпустить код подтверждения
      description: |
        В MVP код возвращается в ответе (`dev_verification_code`), чтобы пользователь
        видел его без доступа к серверной консоли (например, на Render).
        В продакшене код отправляется на e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  already_verified: { type: boolean }
                  dev_verification_code: { type: string, description: 'только в MVP' }
        '404': { description: User not found }

  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Вход по email/паролю, выдача JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Отзыв токена
      responses:
        '200': { description: OK }

  /api/me:
    get:
      tags: [me]
      summary: Текущий пользователь + его профиль/компания
      responses:
        '200': { description: OK }

  /api/me/candidate/profile:
    get:
      tags: [me]
      summary: Профиль текущего кандидата
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
    put:
      tags: [me]
      summary: Обновить поля профиля
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Candidate' }
      responses:
        '200': { description: OK }

  /api/me/privacy:
    put:
      tags: [me]
      summary: Настройки приватности
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                privacy_publish: { type: boolean }
                privacy_show_contacts: { type: boolean }
                privacy_show_achievements: { type: boolean }
                privacy_show_in_search: { type: boolean }
      responses:
        '200': { description: OK }

  /api/me/fsp-link:
    post:
      tags: [me, fsp]
      summary: Привязка ID участника ФСП
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fsp_id]
              properties:
                fsp_id: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: FSP ID уже привязан }

  /api/me/employer/company:
    get:
      tags: [me]
      summary: Профиль компании работодателя
      responses:
        '200': { description: OK }
    put:
      tags: [me]
      summary: Обновить профиль компании
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                website: { type: string }
                city: { type: string }
                logo_url: { type: string }
      responses:
        '200': { description: OK }

  /api/candidates:
    get:
      tags: [candidates]
      security: []
      summary: Список кандидатов (работодателю — без контактов)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidate' }

  /api/candidates/{id}/category:
    get:
      tags: [candidates]
      security: []
      summary: Категория кандидата
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: Not found }

  /api/candidates/{id}/pdf:
    get:
      tags: [candidates]
      security: []
      summary: PDF-профиль кандидата
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403':
          description: Profile private
        '404':
          description: Not found

  /api/candidates/search:
    get:
      tags: [candidates]
      security: []
      summary: Поиск по банку кандидатов
      parameters:
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: grade
          schema: { type: string }
        - in: query
          name: stack
          schema: { type: string }
        - in: query
          name: work_format
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: fsp_only
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate: { $ref: '#/components/schemas/Candidate' }
                        category:
                          type: object
                          properties:
                            category:
                              type: object
                            verified: { type: boolean }
                            achievementsCount: { type: integer }
                            gradeBoosted: { type: boolean }
                        rank:
                          type: object
                          properties:
                            rank: { type: integer }
                            testSignal: { type: integer }
                            fspSignal: { type: integer }

  /api/candidates/{id}/tests:
    post:
      tags: [testing]
      security: []
      summary: Сгенерировать тест для кандидата
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, claimed_grade]
              properties:
                role: { type: string }
                claimed_grade: { type: string, enum: [junior, middle, senior, lead] }
      responses:
        '201': { description: OK }
    get:
      tags: [testing]
      security: []
      summary: История попыток кандидата
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/test-attempts/{id}/submit:
    post:
      tags: [testing]
      security: []
      summary: Отправить ответы и получить результат
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  additionalProperties: { type: integer }
      responses:
        '200': { description: OK }

  /api/candidates/{id}/grade-change-status:
    get:
      tags: [testing]
      security: []
      summary: Доступность смены грейда (cooldown)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/fsp/disciplines:
    get:
      tags: [fsp]
      security: []
      summary: Список дисциплин ФСП
      responses:
        '200': { description: OK }

  /api/fsp/achievements/{fspId}:
    get:
      tags: [fsp]
      security: []
      summary: Достижения участника ФСП
      parameters:
        - in: path
          name: fspId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Achievement' }

  /api/vacancies:
    get:
      tags: [vacancies]
      security: []
      summary: Активные вакансии
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacancy' }
    post:
      tags: [vacancies]
      summary: Создать вакансию (rate-limit 5/час)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, stack, grade, role]
              properties:
                title: { type: string }
                description: { type: string }
                stack: { type: string }
                grade: { type: string, enum: [junior, middle, senior, lead] }
                role: { type: string }
                salary_from: { type: integer }
                salary_to: { type: integer }
                work_format: { type: string, enum: [office, hybrid, remote] }
                city: { type: string }
      responses:
        '201': { description: Created }
        '429': { description: Rate limit }

  /api/vacancies/{id}:
    get:
      tags: [vacancies]
      security: []
      summary: Конкретная вакансия
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      tags: [vacancies]
      summary: Редактировать свою вакансию
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }

  /api/vacancies/{id}/matches:
    get:
      tags: [vacancies]
      security: []
      summary: Подбор кандидатов под вакансию
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /api/vacancies/{id}/report:
    post:
      tags: [vacancies]
      security: []
      summary: Жалоба на вакансию
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                details: { type: string }
                reporter_email: { type: string }
      responses:
        '201': { description: OK }

  /api/offers:
    get:
      tags: [offers]
      summary: Список офферов (со стороны роли)
      responses:
        '200': { description: OK }
    post:
      tags: [offers]
      summary: Отправить оффер (salary_from/to обязательны)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vacancy_id, candidate_id, salary_from]
              properties:
                vacancy_id: { type: integer }
                candidate_id: { type: integer }
                salary_from: { type: integer }
                salary_to: { type: integer }
                message: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: salary required }
        '403': { description: Not your vacancy }

  /api/offers/{id}:
    patch:
      tags: [offers]
      summary: Сменить статус (sent/viewed/accepted/declined)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [viewed, accepted, declined] }
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }

  /api/offers/{id}/contact:
    get:
      tags: [offers]
      summary: Раскрытие контактов по офферу (по стороне)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '403': { description: Contacts hidden until accept }

  /api/applications:
    get:
      tags: [applications]
      summary: Список откликов (со стороны роли)
      responses:
        '200': { description: OK }
    post:
      tags: [applications]
      summary: Кандидат откликается на вакансию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vacancy_id]
              properties:
                vacancy_id: { type: integer }
                cover_letter: { type: string }
      responses:
        '201': { description: Created }
        '409': { description: Already applied }

  /api/applications/{id}:
    patch:
      tags: [applications]
      summary: Сменить статус (sent/viewed/accepted/declined)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [viewed, accepted, declined] }
      responses:
        '200': { description: OK }

  /api/tasks:
    get:
      tags: [tasks]
      summary: Список заданий (со стороны роли)
      responses:
        '200': { description: OK }
    post:
      tags: [tasks]
      summary: Работодатель назначает задание
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id, title, description]
              properties:
                candidate_id: { type: integer }
                vacancy_id: { type: integer }
                title: { type: string }
                description: { type: string }
                due_at: { type: string, format: date-time }
      responses:
        '201': { description: Created }

  /api/tasks/{id}/submit:
    post:
      tags: [tasks]
      summary: Кандидат отправляет решение
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solution]
              properties:
                solution: { type: string }
      responses:
        '200': { description: OK }

  /api/tasks/{id}/review:
    post:
      tags: [tasks]
      summary: Работодатель оценивает решение
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                score: { type: integer }
                comment: { type: string }
                status: { type: string, enum: [reviewed_ok, reviewed_bad] }
      responses:
        '200': { description: OK }

  /api/admin/reports:
    get:
      tags: [admin]
      summary: Список жалоб (admin)
      responses:
        '200': { description: OK }

  /api/admin/moderate/{vacancyId}:
    post:
      tags: [admin]
      summary: Модерация вакансии (admin)
      parameters:
        - in: path
          name: vacancyId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ok, review, hidden] }
                note: { type: string }
      responses:
        '200': { description: OK }

  /api/admin/audit:
    get:
      tags: [admin]
      summary: Журнал действий (admin)
      responses:
        '200': { description: OK }

  /api/ats/events:
    get:
      tags: [admin]
      summary: События интеграции с ATS (admin)
      responses:
        '200': { description: OK }

  /api/ats/push-candidate:
    post:
      tags: [admin]
      summary: Push кандидата во внешнюю ATS (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_id]
              properties:
                system: { type: string, default: mock }
                candidate_id: { type: integer }
      responses:
        '200': { description: OK }