# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agregator-it-vakansiy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production